[project]
name = "qa-assistant"
version = "0.1.0"
description = "QA Assistant — génération de cas de test fonctionnels via LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # ── LLM & LangChain ──────────────────────────────────────────────────
    "langchain>=0.3.25",
    "langchain-openai>=0.3.18",
    "langchain-community>=0.3.24,<0.4.0",
    "langchain-chroma>=0.2.4",
    "openai>=1.82.0",
    # ── API ───────────────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11.0",
    # ── RAG ───────────────────────────────────────────────────────────────
    "chromadb>=1.0.9",
    "tiktoken>=0.9.0",
    "pymupdf>=1.24.0",
    # ── Évaluation qualité ────────────────────────────────────────────────
    "ragas>=0.2.15",
    "datasets>=3.6.0",
    # ── Utilitaires ───────────────────────────────────────────────────────
    "python-dotenv>=1.1.0",
    "requests>=2.32.0",
    "pillow>=12.2.0",
    "langchain-text-splitters>=1.1.2",
    "sentence-transformers>=5.5.1",
    # ── Observabilité / Tracing ───────────────────────────────────────────────
    "langfuse>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
